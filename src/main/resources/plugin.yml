name: ProPlayerHolo
version: 1.0.0
main: com.allfire.proplayerholo.ProPlayerHolo
api-version: '1.21'
author: AllF1RE
description: Display customizable player info holograms
depend:
  - PlaceholderAPI
softdepend:
  - Vault
commands:
  proplayerholo:
    description: Управление плагином ProPlayerHolo
    usage: /proplayerholo <reload|profile|list>
    aliases: [pph, playerholo]
permissions:
  proplayerholo.use:
    description: Базовое право на использование плагина
    default: true
  proplayerholo.reload:
    description: Право на перезагрузку конфига
    default: op
  proplayerholo.admin:
    description: Административное право (доступ ко всем профилям)
    default: op
  proplayerholo.profile.basic:
    description: Доступ к базовому профилю
    default: true
  proplayerholo.profile.vip:
    description: Доступ к VIP профилю
    default: op
  proplayerholo.profile.premium:
    description: Доступ к премиум профилю
    default: op
  proplayerholo.profile.admin:
    description: Доступ к админ профилю
    default: op
