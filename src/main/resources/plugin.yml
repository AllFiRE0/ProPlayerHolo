name: ProPlayerHolo
version: 1.0.0
main: com.allfire.proplayerholo.ProPlayerHolo
api-version: '1.21'
author: AllF1RE
description: Customizable player info holograms with profiles
depend:
  - PlaceholderAPI
softdepend:
  - Vault
commands:
  proplayerholo:
    description: ProPlayerHolo main command
    usage: /<command> <reload|profile|list>
    aliases: [pph, playerholo]
permissions:
  proplayerholo.use:
    description: Allows using the hologram display feature
    default: true
  proplayerholo.reload:
    description: Allows reloading the plugin config
    default: op
  proplayerholo.admin:
    description: Admin access to all profiles
    default: op
  proplayerholo.profile.basic:
    description: Access to basic profile
    default: true
  proplayerholo.profile.vip:
    description: Access to VIP profile
    default: op
  proplayerholo.profile.premium:
    description: Access to Premium profile
    default: op
  proplayerholo.profile.admin:
    description: Access to Admin profile
    default: op
