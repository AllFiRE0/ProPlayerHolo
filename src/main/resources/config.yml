# ProPlayerHolo by AllF1RE
# 
# Позиции голограммы (position):
#   ABOVE       - над головой цели
#   FRONT       - перед лицом цели
#   BACK        - за спиной цели
#   LEFT        - слева от цели
#   RIGHT       - справа от цели
#   BELOW       - под ногами цели
#   ABOVE_FRONT - спереди сверху
#
# Режимы отображения (billboard):
#   FIXED      - зафиксирована, не поворачивается
#   VERTICAL   - поворачивается только вверх/вниз
#   HORIZONTAL - поворачивается только влево/вправо
#   CENTER     - всегда лицом к зрителю
#
# Цвета указываются в формате MiniMessage:
#   <red>, <green>, <blue>, <yellow>, <gold>, <aqua>,
#   <light_purple>, <white>, <gray>, <dark_gray>, <black>,
#   <dark_red>, <dark_green>, <dark_blue>
#   Или HEX: <#FF5733>

settings:
  # Максимальное расстояние в блоках до цели
  max-distance: 15.0
  # Чувствительность угла обзора (0.0 - 1.0, где 1.0 = смотреть точно на цель)
  view-angle: 0.95
  # Интервал обновления в тиках (20 тиков = 1 секунда)
  update-interval: 10
  # Если true - без права proplayerholo.use клик не срабатывает и не выводит сообщение
  silent-no-permission: true

# Профили голограмм (можно добавлять бесконечно)
profiles:
  basic:
    permission: "proplayerholo.profile.basic"
    name: "<green>Базовый"
    description:
      - "<gray>Самый простой профиль"
      - "<gray>Показывает основную информацию"
    display:
      size: 1.0
      position: "ABOVE"
      billboard: "VERTICAL"
      height-offset: 0.5
      offset-x: 0.0
      offset-y: 0.0
      offset-z: 0.0
    background:
      enabled: true
      opacity: 0.3
      color: "#000000"
      glowing: false
      glow-color: "#FFFFFF"
    lines:
      - "<gold>👤 <white>%player_name%"
      - "<green>❤ <white>%player_health%"

  vip:
    permission: "proplayerholo.profile.vip"
    name: "<gold>VIP"
    description:
      - "<gray>Расширенный профиль"
      - "<gray>Показывает баланс и статистику"
    display:
      size: 1.1
      position: "ABOVE_FRONT"
      billboard: "CENTER"
      height-offset: 0.3
      offset-x: 0.0
      offset-y: 0.0
      offset-z: 0.0
    background:
      enabled: true
      opacity: 0.4
      color: "#1a1a2e"
      glowing: true
      glow-color: "#FFD700"
    lines:
      - "<gold>⭐ <white>%player_name%"
      - "<green>💰 Баланс: <white>%vault_eco_balance%"
      - "<red>❤ Здоровье: <white>%player_health%"
      - "<aqua>📶 Пинг: <white>%player_ping%ms"

  premium:
    permission: "proplayerholo.profile.premium"
    name: "<light_purple>Premium"
    description:
      - "<gray>Премиум профиль"
      - "<gray>Максимальная информация"
    display:
      size: 1.2
      position: "FRONT"
      billboard: "FIXED"
      height-offset: 1.0
      offset-x: 0.0
      offset-y: 0.0
      offset-z: 0.0
    background:
      enabled: true
      opacity: 0.5
      color: "#2d1b4e"
      glowing: true
      glow-color: "#E0A0FF"
    lines:
      - "<light_purple>💎 <white>%player_name%"
      - "<green>💰 Баланс: <white>%vault_eco_balance%"
      - "<red>❤ Здоровье: <white>%player_health%"
      - "<aqua>📶 Пинг: <white>%player_ping%ms"
      - "<yellow>⏱ Наиграно: <white>%statistic_time_played%"
      - "<gold>⚔ Убийств: <white>%statistic_player_kills%"
      - "<gray>💀 Смертей: <white>%statistic_deaths%"

  admin:
    permission: "proplayerholo.profile.admin"
    name: "<red>Admin"
    description:
      - "<gray>Административный профиль"
      - "<gray>Показывает всю информацию"
    display:
      size: 1.3
      position: "ABOVE"
      billboard: "VERTICAL"
      height-offset: 0.5
      offset-x: 0.0
      offset-y: 0.0
      offset-z: 0.0
    background:
      enabled: true
      opacity: 0.6
      color: "#3d0000"
      glowing: true
      glow-color: "#FF0000"
    lines:
      - "<red>👑 <white>%player_name%"
      - "<green>💰 Баланс: <white>%vault_eco_balance%"
      - "<red>❤ Здоровье: <white>%player_health%"
      - "<aqua>📶 Пинг: <white>%player_ping%ms"
      - "<yellow>⏱ Наиграно: <white>%statistic_time_played%"
      - "<gold>⚔ Убийств: <white>%statistic_player_kills%"
      - "<gray>💀 Смертей: <white>%statistic_deaths%"
      - "<light_purple>🌍 Мир: <white>%player_world%"
      - "<blue>🎯 XYZ: <white>%player_x% %player_y% %player_z%"

# Профиль по умолчанию (если игрок не выбрал другой)
default-profile: "basic"

# Сообщения плагина (оставь "" чтобы не выводить)
messages:
  no-permission: ""
  no-profile-permission: "<red>У вас нет доступа к профилю %profile%!"
  profile-not-found: "<red>Профиль %profile% не найден!"
  profile-selected: "<green>Выбран профиль: %profile_name%"
  profile-list-header: "<gold>▌ Доступные профили:"
  profile-list-item: "  <yellow>%profile_id% <dark_gray>▸ %profile_name%"
  display-on: ""
  display-off: ""
  config-reloaded: "<green>✔ Конфигурация перезагружена!"
