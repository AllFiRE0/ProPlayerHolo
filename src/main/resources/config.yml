# ============================================================
#
# ОСНОВНЫЕ ВОЗМОЖНОСТИ:
#   - Shift+ПКМ по игроку для отображения голограммы
#   - Бесконечное количество настраиваемых профилей
#   - Каждый профиль имеет своё право доступа
#   - Полная поддержка PlaceholderAPI (плейсхолдеры применяются к цели)
#   - Поддержка MiniMessage для форматирования текста
#
# РЕЖИМЫ ОТОБРАЖЕНИЯ (mode):
#   TARGET_TRACKING - голограмма привязана к цели (игроку, на которого нажали)
#                     Исчезает когда: отошел на max-distance блоков
#                                    перестал смотреть на цель
#                                    цель или viewer вышли из игры
#   VIEWER_FACE     - голограмма появляется перед лицом viewer (тем, кто нажал)
#                     Держится настроенное количество секунд (duration)
#                     Не зависит от того, смотрит ли viewer на цель
#                     Следует за поворотом головы viewer
#
# ПОЗИЦИИ ОТОБРАЖЕНИЯ (position):
#   ABOVE       - над головой цели
#   FRONT       - перед лицом цели (между целью и viewer)
#   BACK        - за спиной цели (относительно viewer)
#   LEFT        - слева от цели (относительно viewer)
#   RIGHT       - справа от цели (относительно viewer)
#   BELOW       - под ногами цели
#   ABOVE_FRONT - спереди сверху под углом
#   CUSTOM      - полностью ручная настройка через offset-x/y/z
#
#   Примечание: для режима VIEWER_FACE позиции работают относительно viewer,
#               а не относительно цели. FRONT = прямо перед лицом viewer.
#
# BILLBOARD (поворот голограммы):
#   FIXED      - зафиксирована в пространстве, не поворачивается
#   VERTICAL   - поворачивается только вверх/вниз к зрителю
#   HORIZONTAL - поворачивается только влево/вправо к зрителю
#   CENTER     - всегда повёрнута лицом к зрителю (рекомендуется)
#
# MINIMESSAGE ФОРМАТИРОВАНИЕ:
#   Все строки поддерживают MiniMessage:
#     Цвета: <red>, <green>, <blue>, <yellow>, <gold>, <aqua>,
#            <light_purple>, <white>, <gray>, <dark_gray>, <black>,
#            <dark_red>, <dark_green>, <dark_blue>
#     HEX:   <#FF5733>текст</#FF5733>
#     Градиент: <gradient:red:blue>текст</gradient>
#     Радуга:   <rainbow>текст</rainbow>
#     Жирный:   <bold>текст</bold>
#     Курсив:   <italic>текст</italic>
#     Подчёркнутый: <underlined>текст</underlined>
#     Зачёркнутый:  <strikethrough>текст</strikethrough>
#     Тень:     <shadow:color:offsetX:offsetY>текст</shadow>
#     Пример:   <shadow:#000000:2:2><gold>Текст с тенью</gold></shadow>
#
# PLACEHOLDERAPI:
#   Все плейсхолдеры применяются к цели (игроку, на которого нажали)
#   Примеры:
#     %player_name%           - имя цели
#     %player_health%         - здоровье цели
#     %player_ping%           - пинг цели
#     %vault_eco_balance%     - баланс цели (требуется Vault)
#     %statistic_time_played% - наиграно времени
#     %player_world%          - мир, в котором цель
#     %player_x% %player_y% %player_z% - координаты цели

# ==================== ОСНОВНЫЕ НАСТРОЙКИ ====================
settings:
  # Максимальное расстояние в блоках от viewer до цели
  # При превышении голограмма исчезает (для TARGET_TRACKING)
  max-distance: 15.0  
  # Чувствительность отслеживания взгляда (0.0 - 1.0)
  # 1.0 = нужно смотреть точно на цель
  # 0.9 = достаточно смотреть в сторону цели (широкий угол)
  # 0.95 = золотая середина (~18 градусов)
  view-angle: 0.95  
  # Интервал обновления в тиках (20 тиков = 1 секунда)
  # Как часто обновляется: позиция, текст, проверка взгляда
  # Меньше = плавнее, но больше нагрузка на сервер
  # Рекомендуется: 5-20
  update-interval: 5 
  # Если true - при отсутствии права proplayerholo.use
  # клик Shift+ПКМ полностью игнорируется без сообщений
  # Если false - будет показано сообщение no-permission
  silent-no-permission: true

# ==================== ПРОФИЛИ ГОЛОГРАММ ====================
# Можно добавлять бесконечное количество профилей
# Каждый профиль имеет уникальное право доступа
# Игроки могут переключаться между доступными профилями: /pph profile <id>
profiles:
  # -------------------- БАЗОВЫЙ ПРОФИЛЬ --------------------
  basic:
    # Право для использования этого профиля
    permission: "proplayerholo.profile.basic"
    # Отображаемое имя (поддерживает MiniMessage)
    name: "<green>Базовый"
    # Описание в /pph list
    description:
      - "<gray>Самый простой профиль"
      - "<gray>Показывает имя и здоровье"
    # Режим отображения
    # TARGET_TRACKING - привязана к цели, следит за взглядом
    # VIEWER_FACE     - перед лицом viewer на N секунд
    mode: "TARGET_TRACKING"
    # Длительность в секундах (только для VIEWER_FACE)
    # Сколько секунд голограмма висит перед лицом viewer
    duration: 10
    # Настройки отображения голограммы
    display:
      # Общий размер голограммы (множитель)
      # Используется если scale-x/y/z = 0
      size: 0.3
      # Индивидуальный размер по осям (переопределяет size если > 0)
      # scale-x = ширина (0 = использовать size)
      # scale-y = высота (0 = использовать size)
      # scale-z = глубина (0 = использовать size)
      scale-x: 0.0
      scale-y: 0.0
      scale-z: 0.0
      # Позиция относительно цели (или viewer для VIEWER_FACE)
      position: "FRONT"
      # Billboard (поворот голограммы)
      billboard: "CENTER"
      # Дополнительное смещение по высоте (блоков)
      # Применяется после расчета базовой позиции
      height-offset: 0.5
      # Точное смещение по осям (блоков)
      # Применяется после расчета базовой позиции
      # Для CUSTOM позиции — это единственные координаты
      offset-x: 0.0  # Вправо (+), влево (-)
      offset-y: 0.5  # Вверх (+), вниз (-)
      offset-z: 0.0  # Вперёд (+), назад (-)
      # Дистанция от цели/игрока (блоков)
      # Для FRONT/BACK/LEFT/RIGHT/ABOVE_FRONT
      distance: 0.9
    # Настройки тени текста (поддерживает MiniMessage)
    # Тень добавляется КАЖДОЙ строке автоматически
    text-shadow:
      # Включить/выключить тень
      enabled: true
      # Цвет тени (HEX или название цвета MiniMessage)
      color: "#000000"
      # Смещение тени по X и Y (пиксели)
      offset-x: 1
      offset-y: 1
    # Настройки фона голограммы
    background:
      # Показывать ли фон
      enabled: true
      # Прозрачность фона (0.0 - полностью прозрачный, 1.0 - полностью непрозрачный)
      opacity: 0.0
      # Цвет фона в HEX
      color: "#000000"
      # Свечение голограммы (контур)
      glowing: true
      # Цвет свечения в HEX
      glow-color: "#FFFFFF"
      # Интенсивность свечения (0-15, как у светящихся блоков)
      # 0 = стандартное свечение
      # 15 = максимальная яркость
      glow-intensity: 15
    # Строки голограммы (поддерживают PlaceholderAPI и MiniMessage)
    # Каждая строка применяется к цели (игроку, на которого нажали)
    lines: 
      - "<light_purple>💎 <white>%player_name%"
      - "<green>💰 Баланс: <white>%vault_eco_balance%&x&F&F&F&E&7&2⛂"
      - "<blue>Коины:&f%playerpoints_points_shorthand%&x&C&D&A&A&7&0◎"
      - "<red>❤ Здоровье: <white>%player_health%"
      - "<aqua>📶 Пинг: <white>%player_ping%ms"
      - "<yellow>⏱ Наиграно: <white>%statistic_time_played%"
      - "<gold>⚔ Убийств: <white>%statistic_player_kills%"
      - "<gray>💀 Смертей: <white>%statistic_deaths%"
     

  # -------------------- VIP ПРОФИЛЬ --------------------
  vip:
    permission: "proplayerholo.profile.vip"
    name: "<gold>⭐ VIP"
    description:
      - "<gray>Расширенный профиль"
      - "<gray>Показывает баланс, здоровье и пинг"
    mode: "TARGET_TRACKING"
    duration: 10
    display:
      size: 1.1
      scale-x: 0.0
      scale-y: 0.0
      scale-z: 0.0
      position: "ABOVE_FRONT"
      billboard: "CENTER"
      height-offset: 0.3
      offset-x: 0.0
      offset-y: 0.0
      offset-z: 0.0
      distance: 1.2
    text-shadow:
      enabled: true
      color: "#FFD700"
      offset-x: 2
      offset-y: 2
    background:
      enabled: true
      opacity: 0.4
      color: "#1a1a2e"
      glowing: true
      glow-color: "#FFD700"
      glow-intensity: 5
    lines:
      - "<gold>⭐ <white>%player_name%"
      - "<green>💰 Баланс: <white>%vault_eco_balance%"
      - "<red>❤ Здоровье: <white>%player_health%"
      - "<aqua>📶 Пинг: <white>%player_ping%ms"

  # -------------------- PREMIUM ПРОФИЛЬ --------------------
  premium:
    permission: "proplayerholo.profile.premium"
    name: "<light_purple>💎 Premium"
    description:
      - "<gray>Премиум профиль"
      - "<gray>Расширенная информация"
    mode: "TARGET_TRACKING"
    duration: 10
    display:
      size: 1.2
      scale-x: 0.0
      scale-y: 0.0
      scale-z: 0.0
      position: "ABOVE"
      billboard: "CENTER"
      height-offset: 1.0
      offset-x: 0.0
      offset-y: 0.0
      offset-z: 0.0
      distance: 2.0
    text-shadow:
      enabled: true
      color: "#E0A0FF"
      offset-x: 2
      offset-y: 3
    background:
      enabled: true
      opacity: 0.5
      color: "#2d1b4e"
      glowing: true
      glow-color: "#E0A0FF"
      glow-intensity: 8
    lines:
      - "<light_purple>💎 <white>%player_name%"
      - "<green>💰 Баланс: <white>%vault_eco_balance%"
      - "<red>❤ Здоровье: <white>%player_health%"
      - "<aqua>📶 Пинг: <white>%player_ping%ms"
      - "<yellow>⏱ Наиграно: <white>%statistic_time_played%"
      - "<gold>⚔ Убийств: <white>%statistic_player_kills%"
      - "<gray>💀 Смертей: <white>%statistic_deaths%"

  # -------------------- ПРИМЕР: ГОЛОГРАММА ПЕРЕД ЛИЦОМ --------------------
  viewer_face_example:
    permission: "proplayerholo.profile.admin"
    name: "<aqua>👁 Перед лицом"
    description:
      - "<gray>Пример режима VIEWER_FACE"
      - "<gray>Голограмма висит перед вами 15 секунд"
    # Этот профиль использует режим "перед лицом viewer"
    mode: "VIEWER_FACE"
    # Будет висеть 15 секунд перед лицом
    duration: 15
    display:
      size: 1.0
      scale-x: 0.0
      scale-y: 0.0
      scale-z: 0.0
      # Позиция FRONT = прямо перед лицом viewer
      position: "FRONT"
      billboard: "CENTER"
      height-offset: 0.5
      offset-x: 0.0
      offset-y: 0.0
      offset-z: 0.0
      # Дистанция от лица viewer
      distance: 3.0
    text-shadow:
      enabled: true
      color: "#00FFFF"
      offset-x: 2
      offset-y: 2
    background:
      enabled: true
      opacity: 0.3
      color: "#003333"
      glowing: true
      glow-color: "#00FFFF"
      glow-intensity: 10
    lines:
      - "<aqua>👁 <white>%player_name%"
      - "<green>💰 <white>%vault_eco_balance%"

  # -------------------- ПРИМЕР: ПОЛНОСТЬЮ КАСТОМНАЯ ПОЗИЦИЯ --------------------
  custom_position_example:
    permission: "proplayerholo.profile.admin"
    name: "<blue>🔧 Кастомная позиция"
    description:
      - "<gray>Пример полностью ручной позиции"
      - "<gray>Голограмма справа-сверху от цели"
    mode: "TARGET_TRACKING"
    duration: 10
    display:
      size: 0.9
      scale-x: 0.0
      scale-y: 1.3
      scale-z: 0.0
      # CUSTOM = только offset определяет позицию
      position: "CUSTOM"
      billboard: "CENTER"
      height-offset: 0.0
      # 2 блока вправо, 2 вверх, 1 назад от цели
      offset-x: 2.0
      offset-y: 2.0
      offset-z: -1.0
      distance: 0.0
    text-shadow:
      enabled: false
      color: "#000000"
      offset-x: 0
      offset-y: 0
    background:
      enabled: true
      opacity: 0.4
      color: "#000033"
      glowing: true
      glow-color: "#4444FF"
      glow-intensity: 7
    lines:
      - "<blue>🔧 <white>%player_name%"
      - "<yellow>📍 <white>%player_x% %player_y% %player_z%"

  # -------------------- АДМИН ПРОФИЛЬ --------------------
  admin:
    permission: "proplayerholo.profile.admin"
    name: "<red>👑 Admin"
    description:
      - "<gray>Административный профиль"
      - "<gray>Максимальная информация"
    mode: "TARGET_TRACKING"
    duration: 10
    display:
      size: 1.3
      scale-x: 0.0
      scale-y: 0.0
      scale-z: 0.0
      position: "ABOVE"
      billboard: "CENTER"
      height-offset: 0.5
      offset-x: 0.0
      offset-y: 0.0
      offset-z: 0.0
      distance: 1.5
    text-shadow:
      enabled: true
      color: "#FF0000"
      offset-x: 2
      offset-y: 2
    background:
      enabled: true
      opacity: 0.6
      color: "#3d0000"
      glowing: true
      glow-color: "#FF0000"
      glow-intensity: 12
    lines:
      - "<red>👑 <white>%player_name%"
      - "<green>💰 Баланс: <white>%vault_eco_balance%"
      - "<red>❤ Здоровье: <white>%player_health%"
      - "<aqua>📶 Пинг: <white>%player_ping%ms"
      - "<yellow>⏱ Наиграно: <white>%statistic_time_played%"
      - "<gold>⚔ Убийств: <white>%statistic_player_kills%"
      - "<gray>💀 Смертей: <white>%statistic_deaths%"
      - "<light_purple>🌍 Мир: <white>%player_world%"
      - "<blue>🎯 XYZ: <white>%player_x% %player_y% %player_z%"

# Профиль по умолчанию для новых игроков
default-profile: "basic"
# ==================== СООБЩЕНИЯ ПЛАГИНА ====================
# Оставь пустым "" чтобы не выводить сообщение
# Поддерживает MiniMessage
messages:
  # При отсутствии права proplayerholo.use
  # Не показывается если silent-no-permission: true
  no-permission: "<red>У вас недостаточно прав."
  # При попытке выбрать профиль без прав
  no-profile-permission: "<red>❌ У вас нет доступа к профилю <yellow>%profile%</yellow>!"
  # Указанный профиль не найден в конфиге
  profile-not-found: "<red>❌ Профиль <yellow>%profile%</yellow> не найден!"
  # Профиль успешно выбран
  profile-selected: "<green>✔ Выбран профиль: %profile_name%"
  # Заголовок списка профилей
  profile-list-header: "<gold>▌ Доступные профили:"
  # Элемент списка профилей
  profile-list-item: "  <yellow>%profile_id% <dark_gray>▸ %profile_name%"
  # При показе голограммы (Shift+ПКМ)
  display-on: ""
  # При скрытии голограммы (повторный Shift+ПКМ)
  display-off: ""
  # При перезагрузке конфига
  config-reloaded: "<green>✔ Конфигурация перезагружена!"
  
