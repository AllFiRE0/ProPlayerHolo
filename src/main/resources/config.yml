# ProPlayerHolo by AllF1RE
# 
# Позиции голограммы (position):
#   ABOVE       - над головой цели
#   FRONT       - перед лицом цели (между целью и viewer)
#   BACK        - за спиной цели (относительно viewer)
#   LEFT        - слева от цели (относительно viewer)
#   RIGHT       - справа от цели (относительно viewer)
#   BELOW       - под ногами цели
#   ABOVE_FRONT - спереди сверху
#   CUSTOM      - полностью ручная настройка через offset
#
# Billboard:
#   FIXED      - зафиксирована, не поворачивается
#   VERTICAL   - поворачивается только вверх/вниз
#   HORIZONTAL - поворачивается только влево/вправо
#   CENTER     - всегда лицом к зрителю

settings:
  max-distance: 15.0
  view-angle: 0.95
  update-interval: 10
  silent-no-permission: true

profiles:
  basic:
    permission: "proplayerholo.profile.basic"
    name: "<green>Базовый"
    description:
      - "<gray>Самый простой профиль"
      - "<gray>Показывает основную информацию"
    display:
      # Размер: общий множитель
      size: 1.0
      # Детальная настройка размера по осям (переопределяет size если не 0)
      scale-x: 0.0
      scale-y: 0.0
      scale-z: 0.0
      # Позиция
      position: "ABOVE"
      # Детальные offset относительно позиции
      offset-x: 0.0
      offset-y: 0.0
      offset-z: 0.0
      # Высота над базовой позицией
      height-offset: 0.5
      # Дистанция от цели (для FRONT/BACK/LEFT/RIGHT)
      distance: 1.5
      # Billboard
      billboard: "CENTER"
    background:
      enabled: true
      opacity: 0.3
      color: "#000000"
      glowing: false
      glow-color: "#FFFFFF"
    lines:
      - "<gold>👤 <white>%player_name%"
      - "<green>❤ <white>%player_health%"

  vip:
    permission: "proplayerholo.profile.vip"
    name: "<gold>VIP"
    description:
      - "<gray>Расширенный профиль"
      - "<gray>Показывает баланс и статистику"
    display:
      size: 1.1
      scale-x: 0.0
      scale-y: 0.0
      scale-z: 0.0
      position: "ABOVE_FRONT"
      offset-x: 0.0
      offset-y: 0.0
      offset-z: 0.0
      height-offset: 0.3
      distance: 1.2
      billboard: "CENTER"
    background:
      enabled: true
      opacity: 0.4
      color: "#1a1a2e"
      glowing: true
      glow-color: "#FFD700"
    lines:
      - "<gold>⭐ <white>%player_name%"
      - "<green>💰 Баланс: <white>%vault_eco_balance%"
      - "<red>❤ Здоровье: <white>%player_health%"
      - "<aqua>📶 Пинг: <white>%player_ping%ms"

  premium:
    permission: "proplayerholo.profile.premium"
    name: "<light_purple>Premium"
    description:
      - "<gray>Премиум профиль"
      - "<gray>Максимальная информация"
    display:
      size: 1.2
      scale-x: 0.0
      scale-y: 0.0
      scale-z: 0.0
      position: "FRONT"
      offset-x: 0.0
      offset-y: 0.0
      offset-z: 0.0
      height-offset: 1.0
      distance: 2.0
      billboard: "CENTER"
    background:
      enabled: true
      opacity: 0.5
      color: "#2d1b4e"
      glowing: true
      glow-color: "#E0A0FF"
    lines:
      - "<light_purple>💎 <white>%player_name%"
      - "<green>💰 Баланс: <white>%vault_eco_balance%"
      - "<red>❤ Здоровье: <white>%player_health%"
      - "<aqua>📶 Пинг: <white>%player_ping%ms"
      - "<yellow>⏱ Наиграно: <white>%statistic_time_played%"
      - "<gold>⚔ Убийств: <white>%statistic_player_kills%"
      - "<gray>💀 Смертей: <white>%statistic_deaths%"

  custom_example:
    permission: "proplayerholo.profile.admin"
    name: "<blue>Кастомный"
    description:
      - "<gray>Пример ручной настройки"
      - "<gray>Все параметры можно менять"
    display:
      size: 1.0
      # Детальный размер только по высоте (вытянутая голограмма)
      scale-x: 1.0
      scale-y: 1.5
      scale-z: 1.0
      position: "CUSTOM"
      # Ручное смещение: 2 блока вправо, 1 вверх, 3 вперёд от цели
      offset-x: 2.0
      offset-y: 1.0
      offset-z: 3.0
      height-offset: 0.0
      distance: 0.0
      billboard: "CENTER"
    background:
      enabled: true
      opacity: 0.5
      color: "#000033"
      glowing: true
      glow-color: "#4444FF"
    lines:
      - "<blue>🔧 <white>%player_name%"
      - "<green>💰 Баланс: <white>%vault_eco_balance%"
      - "<yellow>📍 XYZ: <white>%player_x% %player_y% %player_z%"

  admin:
    permission: "proplayerholo.profile.admin"
    name: "<red>Admin"
    description:
      - "<gray>Административный профиль"
      - "<gray>Показывает всю информацию"
    display:
      size: 1.3
      scale-x: 0.0
      scale-y: 0.0
      scale-z: 0.0
      position: "ABOVE"
      offset-x: 0.0
      offset-y: 0.0
      offset-z: 0.0
      height-offset: 0.5
      distance: 1.5
      billboard: "CENTER"
    background:
      enabled: true
      opacity: 0.6
      color: "#3d0000"
      glowing: true
      glow-color: "#FF0000"
    lines:
      - "<red>👑 <white>%player_name%"
      - "<green>💰 Баланс: <white>%vault_eco_balance%"
      - "<red>❤ Здоровье: <white>%player_health%"
      - "<aqua>📶 Пинг: <white>%player_ping%ms"
      - "<yellow>⏱ Наиграно: <white>%statistic_time_played%"
      - "<gold>⚔ Убийств: <white>%statistic_player_kills%"
      - "<gray>💀 Смертей: <white>%statistic_deaths%"
      - "<light_purple>🌍 Мир: <white>%player_world%"
      - "<blue>🎯 XYZ: <white>%player_x% %player_y% %player_z%"

default-profile: "basic"

messages:
  no-permission: ""
  no-profile-permission: "<red>У вас нет доступа к профилю %profile%!"
  profile-not-found: "<red>Профиль %profile% не найден!"
  profile-selected: "<green>Выбран профиль: %profile_name%"
  profile-list-header: "<gold>▌ Доступные профили:"
  profile-list-item: "  <yellow>%profile_id% <dark_gray>▸ %profile_name%"
  display-on: ""
  display-off: ""
  config-reloaded: "<green>✔ Конфигурация перезагружена!"
